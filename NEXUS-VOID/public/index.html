<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS-VOID NETWORK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; /* একদম কালো ব্যাকগ্রাউন্ড */
            color: #00ff66; 
            font-family: 'Courier New', Courier, monospace; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #matrix { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.15; }

        .card-container {
            position: relative;
            z-index: 2;
            background: #050505; /* কার্ডের ব্যাকগ্রাউন্ড কালো */
            border: 1px solid #00ff66;
            border-radius: 4px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
        }

        .glitch-title { font-size: 1.5rem; font-weight: bold; text-align: center; margin-bottom: 5px; text-shadow: 0 0 5px #00ff66; }
        .subtitle { font-size: 0.6rem; text-align: center; color: #008833; margin-bottom: 20px; text-transform: uppercase; }

        #chat-box {
            height: 250px;
            overflow-y: auto;
            border: 1px solid #004411;
            padding: 10px;
            margin-bottom: 15px;
            background: #000;
        }

        .chat-input-wrapper { display: flex; gap: 5px; }
        .chat-input-wrapper input {
            flex: 1;
            background: #000;
            border: 1px solid #004411;
            padding: 10px;
            color: #00ff66;
            outline: none;
        }

        .btn-send {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 0 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="card-container">
        <div class="glitch-title">NEXUS // VOID</div>
        <div class="subtitle">SECURE COMMUNICATION NODE</div>
        
        <div id="chat-box"></div>
        <div class="chat-input-wrapper">
            <input type="text" id="chatInput" placeholder="Type encrypted message..">
            <button onclick="sendMsg()" class="btn-send">SEND</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width / 16)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ff66";
            drops.forEach((d, i) => {
                ctx.fillText(Math.random() > 0.5 ? "1" : "0", i * 16, d * 16);
                if (d * 16 > canvas.height && Math.random() > 0.97) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 50);

        function sendMsg() {
            const input = document.getElementById('chatInput');
            if (!input.value.trim()) return;
            document.getElementById('chat-box').innerHTML += `<div>> ${input.value}</div>`;
            input.value = '';
        }
    </script>
</body>
</html>
