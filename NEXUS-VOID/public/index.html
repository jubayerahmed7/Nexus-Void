
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyber-Ops | Command Terminal</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #050505; color: #00ff41; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; z-index: 0; opacity: 0.3; }
        .container { position: relative; z-index: 1; padding: 20px; display: grid; grid-template-columns: 300px 1fr 300px; gap: 20px; height: 100vh; }
        .panel { border: 1px solid #00ff41; background: rgba(0, 0, 0, 0.85); padding: 15px; box-shadow: 0 0 10px rgba(0, 255, 65, 0.2); }
        h2 { text-transform: uppercase; font-size: 14px; border-bottom: 1px solid #00ff41; padding-bottom: 5px; margin-top: 0; }
        .terminal { height: 80%; overflow-y: hidden; font-size: 12px; }
        .data-stream { color: #008f11; font-size: 10px; word-break: break-all; }
        .status-box { margin-bottom: 15px; }
        .bar { height: 10px; background: #333; margin-top: 5px; }
        .fill { height: 100%; background: #00ff41; width: 70%; }
        .main-display { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .access-granted { font-size: 40px; font-weight: bold; text-shadow: 0 0 20px #00ff41; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="container">
        <div class="panel">
            <h2>System Status</h2>
            <div class="status-box">CPU Usage <div class="bar"><div class="fill" style="width: 45%;"></div></div></div>
            <div class="status-box">Network <div class="bar"><div class="fill" style="width: 88%;"></div></div></div>
            <div class="status-box">Security <div class="bar"><div class="fill" style="width: 12%;"></div></div></div>
            <h2>Active Nodes</h2>
            <div class="data-stream" id="nodes"></div>
        </div>
        <div class="panel main-display">
            <h1 class="access-granted">SYSTEM BREACHED</h1>
            <p>Access Level: Root Administrator</p>
            <div class="terminal" id="term"></div>
        </div>
        <div class="panel">
            <h2>Log Stream</h2>
            <div class="data-stream" id="logs" style="height: 90%;"></div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 33);
        const logs = document.getElementById('logs');
        setInterval(() => {
            logs.innerHTML += '> Executing Payload [0x' + Math.floor(Math.random()*16777215).toString(16) + ']<br>';
            if (logs.scrollHeight > 500) logs.innerHTML = "";
        }, 500);
        document.getElementById('nodes').innerHTML = "Node_Alpha: Active<br>Node_Beta: Syncing<br>Gateway: Bypassed";
    </script>
</body>
</html>
